name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short 2>&1

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    # Only run on tag pushes matching v*.*.* from main
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.ref_name != '' &&
      github.event.base_ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes
        id: release_notes
        run: |
          # Try to pull the first unreleased section from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Extract content between first two "## " headings (unreleased section)
            NOTES=$(awk '/^## /{found++} found==1{print} found==2{exit}' CHANGELOG.md | tail -n +2)
          fi

          # Fallback: commits since last tag
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
            fi
          fi

          # Write to file to handle multi-line safely
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          token: ${{ secrets.GITHUB_TOKEN }}
